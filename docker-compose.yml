services:
  gofo-api:
    build: .
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MPLCONFIGDIR: /tmp/matplotlib
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # Mount source so code changes apply without stale image imports.
      - ./api:/app/api
      - ./core:/app/core
      - ./tools:/app/tools
      - ./agents:/app/agents
      - ./prompts:/app/prompts
      - ./frontend:/app/frontend
      - ./config.py:/app/config.py
      - ./agent.py:/app/agent.py
      - ./ingest.py:/app/ingest.py
      - ./assets:/app/assets
      - ./data:/app/data
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data/uploads:/app/data/uploads

  gofo-ui:
    build: .
    env_file:
      - .env
    environment:
      API_BASE_URL: http://gofo-api:8000
      PYTHONPATH: /app
      MPLCONFIGDIR: /tmp/matplotlib
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./api:/app/api
      - ./core:/app/core
      - ./tools:/app/tools
      - ./agents:/app/agents
      - ./prompts:/app/prompts
      - ./frontend:/app/frontend
      - ./config.py:/app/config.py
      - ./agent.py:/app/agent.py
      - ./assets:/app/assets
      - ./data:/app/data
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data/uploads:/app/data/uploads
    depends_on:
      - gofo-api
